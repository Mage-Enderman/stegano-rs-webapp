[package]
name = "stegano-wasm"
version = "0.1.0"
edition = "2021"

# wasm-opt -O2 and above crash on this module (binaryen Precompute pass bug),
# -O1 is the strongest level that produces a working artefact.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O1"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Writing JPEG XL output requires the AGPL-3.0 licensed jxl-encoder crate.
# See crates/stegano-core/Cargo.toml before enabling this for a distributed build.
jxl-encode = ["stegano-core/jxl-encode"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
js-sys = "0.3"
stegano-core = { path = "../stegano-core", version = "0.6.1", default-features = false, features = [
    "jxl",
] }
getrandom = { version = "0.2", features = ["js"] }
