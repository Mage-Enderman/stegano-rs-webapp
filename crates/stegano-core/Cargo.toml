[package]
name = "stegano-core"
description = "Steganography core library. Supports hiding data in PNG images via LSB Encoding."
version = "0.6.1"
authors = ["Sven Kanoldt <sven@d34dl0ck.me>"]
edition = "2021"
license.workspace = true
homepage = "https://www.stegano.org"
readme = "README.md"
keywords = ["steganography", "image", "png", "hiding", "unveil"]
categories = ["encoding", "multimedia::encoding", "multimedia::images"]
repository = "https://github.com/steganogram/stegano-rs"
include = [
    "src/**/*",
    "benches/**/*",
    "LICENSE",
    "README.md",
    "../../CHANGELOG.md",
]

[badges]
codecov = { repository = "steganogram/stegano-rs", branch = "main", service = "github" }
maintenance = { status = "passively-maintained" }

[dependencies]
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
] }
bitstream-io = { version = "4.9" }
zip = { version = "6.0", default-features = false, features = ["deflate"] }
byteorder = "1.5"
hound = "3.5"
thiserror.workspace = true
enum_dispatch = "0.3"

log.workspace = true
env_logger.workspace = true

stegano-seasmoke.workspace = true

# JPEG XL decoding (MIT OR Apache-2.0). Enabled by default so any carrier media
# accepted by the CLI / Wasm layer includes JPEG XL.
jxl-oxide = { version = "0.12", default-features = false, optional = true }
# JPEG XL encoding. NOTE: jxl-encoder is licensed AGPL-3.0-only OR commercial,
# which cannot be combined with this GPL-3.0-only crate without relicensing the
# combined work under AGPL-3.0. It is therefore *opt-in* via `jxl-encode`.
jxl-encoder = { version = "0.3", default-features = false, features = [
    "std",
], optional = true }

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }
tempfile = "3.23"

[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = [
    "prepush-hook",
    "run-cargo-test",
    "run-cargo-clippy",
    "run-cargo-fmt",
]

[features]
default = ["jxl"]
benchmarks = []
# read JPEG XL images as carrier media
jxl = ["dep:jxl-oxide"]
# write JPEG XL output (lossless, modular). Enabling this pulls in the AGPL-3.0
# licensed jxl-encoder crate; see the dependency comment above.
jxl-encode = ["dep:jxl-encoder", "jxl"]
